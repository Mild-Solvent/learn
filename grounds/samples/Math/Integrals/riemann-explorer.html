<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riemann sum explorer</title>
<script src="https://cdn.jsdelivr.net/npm/mathjs@13.0.0/lib/browser/math.js"></script>
<style>
  :root { --bg:#f6f6fb; --panel:#fff; --line:#e2e2ec; --text:#1d1d2b; --muted:#6a6a80; --accent:#5b5bd6; --fill:rgba(91,91,214,.25); --curve:#e5484d; --grid:#ececf3; }
  @media (prefers-color-scheme: dark) { :root { --bg:#12121a; --panel:#1b1b26; --line:#2e2e3e; --text:#ececf4; --muted:#9b9bb2; --accent:#8b8bff; --fill:rgba(139,139,255,.3); --curve:#f87171; --grid:#2a2a38; } }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--muted); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  canvas { width: 100%; height: 320px; display: block; border-radius: 10px; border: 1px solid var(--line); }
  .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px 18px; margin-top: 12px; }
  label { display: grid; gap: 4px; font-size: 14px; font-weight: 600; }
  input, select { font: inherit; color: inherit; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; }
  input[type=range] { padding: 0; accent-color: var(--accent); }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 12px; }
  .stat { background: var(--bg); border-radius: 10px; padding: 10px; }
  .stat b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: var(--muted); }
  .err { color: var(--curve); font-size: 13px; min-height: 1.2em; }
</style>
</head>
<body>
<h1>Riemann sum explorer</h1>
<p>Rectangles estimate the area under the curve. Add more of them and watch the estimate close in on the exact value.</p>
<div class="panel">
  <canvas id="c"></canvas>
  <div class="controls">
    <label>Function f(x)<input id="f" value="x^2" spellcheck="false" autocapitalize="none"></label>
    <label>Rectangles: <span id="nv">8</span><input id="n" type="range" min="1" max="200" value="8"></label>
    <label>Height taken from
      <select id="rule"><option value="left">left edge</option><option value="mid" selected>middle</option><option value="right">right edge</option></select>
    </label>
    <label>From a = <input id="a" type="number" value="0" step="0.5"></label>
    <label>To b = <input id="b" type="number" value="2" step="0.5"></label>
  </div>
  <div class="err" id="err"></div>
  <div class="stats">
    <div class="stat"><span>Rectangles add up to</span><b id="sum">–</b></div>
    <div class="stat"><span>Exact area (numeric)</span><b id="exact">–</b></div>
    <div class="stat"><span>Error</span><b id="diff">–</b></div>
  </div>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
  let f = (x) => x * x;
  function compile() {
    $("err").textContent = "";
    try {
      if (!window.math) throw new Error("math library not loaded; using x^2");
      const code = math.compile($("f").value);
      f = (x) => { const v = code.evaluate({ x }); return typeof v === "number" ? v : NaN; };
      f(0.5);
    } catch (e) { $("err").textContent = e.message; }
  }
  function integrate(a, b) {
    const n = 2000, h = (b - a) / n; let s = f(a) + f(b);
    for (let i = 1; i < n; i++) s += f(a + i * h) * (i % 2 ? 4 : 2);
    return s * h / 3;
  }
  function draw() {
    const c = $("c"), r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr;
    const g = c.getContext("2d"); g.setTransform(dpr, 0, 0, dpr, 0, 0);
    const W = r.width, H = r.height;
    const a = +$("a").value, b = +$("b").value, n = +$("n").value, rule = $("rule").value;
    $("nv").textContent = n;
    const pad = (b - a) * 0.25 || 1, x0 = Math.min(a, b) - pad, x1 = Math.max(a, b) + pad;
    let lo = 0, hi = 0;
    for (let i = 0; i <= 200; i++) { const y = f(x0 + (x1 - x0) * i / 200); if (isFinite(y)) { lo = Math.min(lo, y); hi = Math.max(hi, y); } }
    const yp = (hi - lo) * 0.15 || 1; lo -= yp; hi += yp;
    const X = (x) => (x - x0) / (x1 - x0) * W, Y = (y) => (hi - y) / (hi - lo) * H;
    g.fillStyle = css("--panel"); g.fillRect(0, 0, W, H);
    g.strokeStyle = css("--grid"); g.lineWidth = 1; g.beginPath();
    for (let x = Math.ceil(x0); x <= x1; x++) { g.moveTo(X(x), 0); g.lineTo(X(x), H); }
    g.stroke();
    g.strokeStyle = css("--muted"); g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(W, Y(0)); g.stroke();
    const dx = (b - a) / n; let sum = 0;
    g.fillStyle = css("--fill"); g.strokeStyle = css("--accent");
    for (let i = 0; i < n; i++) {
      const xl = a + i * dx, xs = rule === "left" ? xl : rule === "right" ? xl + dx : xl + dx / 2;
      const y = f(xs); if (!isFinite(y)) continue;
      sum += y * dx;
      const top = Math.min(Y(y), Y(0)), hgt = Math.abs(Y(y) - Y(0));
      g.fillRect(X(xl), top, X(xl + dx) - X(xl), hgt);
      if (n <= 60) g.strokeRect(X(xl), top, X(xl + dx) - X(xl), hgt);
    }
    g.strokeStyle = css("--curve"); g.lineWidth = 2.5; g.beginPath();
    let pen = false;
    for (let i = 0; i <= 600; i++) { const x = x0 + (x1 - x0) * i / 600, y = f(x); if (!isFinite(y)) { pen = false; continue; } pen ? g.lineTo(X(x), Y(y)) : g.moveTo(X(x), Y(y)); pen = true; }
    g.stroke();
    const exact = integrate(a, b);
    $("sum").textContent = sum.toFixed(5); $("exact").textContent = exact.toFixed(5); $("diff").textContent = Math.abs(sum - exact).toFixed(5);
  }
  ["n", "rule", "a", "b"].forEach((id) => $(id).addEventListener("input", draw));
  $("f").addEventListener("input", () => { compile(); draw(); });
  addEventListener("resize", draw);
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  compile(); draw();
})();
</script>
</body>
</html>
